<!doctype html>

<html>

<head>
  <meta charset="utf-8" />
  <title>OCREVUS</title>
  <link rel="stylesheet" href="css/style.css" />

  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <link rel="icon" href="images/icon.png" />
</head>

<body id="main-body">
  <!-- loader  -->
  <div id="loader-wrapper">
    <div id="loader"></div>
    <div class="loader-section section-left"></div>
    <div class="loader-section section-right"></div>
  </div>

  <div class="main-container">

    <section class="left-container">
      <div class="main-header">
        <img src="images/Asset 2.svg" alt="" class="img-fluid">
      </div>
      <div class="left-main__wrap">
        <div class="map-img__wrap">
          <img src="images/Asset 13.svg" alt="" data-hover-src="images/Asset 22.svg" class="img-fluid left-img"
            id="leftImage">
          <img src="images/Asset 11.svg" alt="" data-hover-src="images/Asset 21.svg" class="img-fluid left-img">
        </div>
        <div class="map-img__wrap">
          <img src="images/Asset 10.svg" data-hover-src="images/Asset 20.svg" alt="" class="img-fluid left-img">
          <img src="images/Asset 12.svg" alt="" data-hover-src="images/Asset 19.svg" class="img-fluid left-img">
        </div>

      </div>
    </section>
    <section class="middle-container">
      <div class="top-img__wrap">
        <img src="images/graph.png" alt="" class="img-fluid">
        <div class="top-img__txt-wrap">
          <img src="images/text-white.svg" alt="" class="img-fluid">
        </div>
      </div>
      <div class="bottom-img__wrap">
        <img src="images/Asset 5.svg" alt="" class="img-fluid">
      </div>
    </section>
    <section class="right-container">
      <div class="main-header">
        <img src="images/Asset 1.svg" alt="" class="img-fluid">
      </div>
      <div class="left-main__wrap">
        <div class="map-img__wrap">
          <img src="images/Asset 9.svg" data-hover-src="images/Asset 18.svg" alt="" class="img-fluid left-img">
          <img src="images/Asset 8.svg" data-hover-src="images/Asset 17.svg" alt="" class="img-fluid left-img">
        </div>
        <div class="map-img__wrap">
          <img src="images/Asset 7.svg" data-hover-src="images/Asset 16.svg" alt="" class="img-fluid left-img">
          <img src="images/Asset 6.svg" data-hover-src="images/Asset 15.svg" alt="" class="img-fluid left-img">
        </div>

      </div>
    </section>
  </div>
  <div class="footer">
    <img src="images/Asset 14.png" alt="" class="img-fluid">
  </div>

  <!-- rotate msg  -->
  <div class="rotateMessage">
    <div class="rotateMessage-container">
      <div class="rotateMessage-content">
        <div class="rotateMessage-text">Please rotate to landscape mood</div>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>

</html>
